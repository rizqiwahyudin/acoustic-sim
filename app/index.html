<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acoustic Visualiser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23131417%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%277%27 fill=%27none%27 stroke=%27%237aa7ff%27 stroke-width=%273%27/%3E%3C/svg%3E">
</head>
<body>
<div class="app" id="app">
  <header class="app-header" id="appHeader">
    <div class="app-header__left">
      <span class="app-brand">Acoustic Visualiser</span>
      <nav class="app-nav" aria-label="Workspace" id="appNav">
        <a href="#beam" data-route="beam">Beam pattern</a>
        <a href="#sim" data-route="sim">Simulator</a>
        <a href="#hardware" data-route="hardware">Hardware</a>
        <a href="#study" data-route="study">Study</a>
      </nav>
    </div>
    <div class="app-header__right" id="linkSummary">
      <span class="link-state" id="linkState" data-state="disconnected" role="status">
        <span class="link-state__dot" aria-hidden="true"></span><span id="linkText">Not connected</span>
      </span>
      <span id="linkGrid" class="link-grid" hidden></span>
      <button type="button" class="btn" id="btnDisconnect" hidden>Disconnect</button>
    </div>
  </header>
  <main class="app-main" id="views"></main>
</div>
<script type="module" src="js/shell.js"></script>
</body>
</html>
